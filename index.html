<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Voxel Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="brand">VOXEL QUEST</div>
    <div class="stats"><span>❤️ <b id="hp">100</b></span><span>🪙 <b id="coins">0</b></span><span>🧱 <b id="blocks">0</b></span></div>
    <div id="tip">WASD / tombol layar untuk bergerak • klik/tap dunia untuk menambang blok</div>
  </div>
  <div id="crosshair">+</div>
  <div id="controls">
    <button data-key="KeyW">▲</button>
    <div><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div>
    <button id="mine">⛏</button>
  </div>
  <div id="start"><div class="panel"><h1>VOXEL QUEST</h1><p>Dunia voxel 3D ringan langsung di browser.</p><button id="play">MAIN</button></div></div>
  <script type="module" src="game.js"></script>
</body>
</html>
